name: Test

on: [push]

jobs:
  build:

    continue-on-error: ${{ matrix.experimental || false }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-26.04
            python-version: "3.14"
            experimental: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install openmpi
        run: sudo apt update && sudo apt install -y openmpi-bin libopenmpi-dev
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip # This path is specific to Ubuntu
          key: ${{ matrix.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ matrix.os }}-pip-
      - name: Install dependencies
        run: |
          pip install .
          pip install tox
          pip install tox-direct

      - name: Test with tox / nose
        run: |
          tox --direct

  spackiepath:
    name: SpackiePath (Python 3.14)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install openmpi
        run: sudo apt update && sudo apt install -y openmpi-bin libopenmpi-dev

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip # This path is specific to Ubuntu
          key: ubuntu-24.04-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ubuntu-24.04-pip-

      - name: Install with SpackiePath
        shell: bash
        run: |
          pip install scikit-build-core cython numpy mpi4py torch torchvision matplotlib
          cmake -S . -B build/spackiepath -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          cmake --build build/spackiepath -j
          cmake --install build/spackiepath --prefix "${RUNNER_TEMP}/torchbraid-spackiepath-prefix"
          python -m venv "${RUNNER_TEMP}/torchbraid-spackiepath-venv"
          source "${RUNNER_TEMP}/torchbraid-spackiepath-venv/bin/activate"
          pip install --upgrade pip
          pip install scikit-build-core cython numpy mpi4py torch torchvision matplotlib tox tox-direct
          SKBUILD_CMAKE_DEFINE="TORCHBRAID_SPACKIEPATH_PREFIX=${RUNNER_TEMP}/torchbraid-spackiepath-prefix" pip install "${GITHUB_WORKSPACE}" --no-build-isolation

      - name: Test with tox / nose via SpackiePath
        shell: bash
        run: |
          source "${RUNNER_TEMP}/torchbraid-spackiepath-venv/bin/activate"
          tox --direct
